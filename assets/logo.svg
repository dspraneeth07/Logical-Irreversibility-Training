<svg xmlns="http://www.w3.org/2000/svg" width="96" height="96" viewBox="0 0 96 96" role="img" aria-labelledby="t2">
<title id="t2">LandauerGap</title>
<style>
  .flow{stroke-dasharray:3 4;animation:flow 2.4s linear infinite}
  .float{animation:float 5s ease-in-out infinite}
  .float2{animation:float 5s ease-in-out -2.5s infinite}
  .pulse{transform-box:fill-box;transform-origin:50% 100%;animation:pulse 1.6s ease-in-out infinite}
  .blink{animation:blink 2.8s ease-in-out infinite}
  @keyframes flow{to{stroke-dashoffset:-14}}
  @keyframes float{50%{transform:translateY(-1.6px)}}
  @keyframes pulse{50%{transform:scaleY(.55)}}
  @keyframes blink{50%{opacity:.35}}
  @media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<defs>
  <linearGradient id="bg2" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1c2068"/><stop offset=".55" stop-color="#121543"/><stop offset="1" stop-color="#090b26"/></linearGradient>
  <radialGradient id="glow2" cx=".85" cy=".1" r=".75"><stop offset="0" stop-color="#5b63ff" stop-opacity=".45"/><stop offset="1" stop-color="#5b63ff" stop-opacity="0"/></radialGradient>
  <linearGradient id="bulb2" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#a8559b"/><stop offset="1" stop-color="#f2c46d"/></linearGradient>
  <filter id="soft2" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="1.6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
<rect x=".75" y=".75" width="94.5" height="94.5" rx="22" fill="url(#bg2)" stroke="#ffffff" stroke-opacity=".14" stroke-width="1.5"/>
<rect x=".75" y=".75" width="94.5" height="94.5" rx="22" fill="url(#glow2)"/>
<rect class="float" x="14" y="30" width="26" height="32" rx="7" fill="#5c5fd6" fill-opacity="0.35" stroke="#9095f5" stroke-opacity=".55" stroke-width="1.2"/><rect class="float2" x="56" y="30" width="26" height="32" rx="7" fill="#5c5fd6" fill-opacity="0.35" stroke="#9095f5" stroke-opacity=".55" stroke-width="1.2"/><path d="M40 46 H56" stroke="#f2c46d" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round" class="flow"/><circle class="blink" cx="48" cy="46" r="3.4" fill="#ffffff" filter="url(#soft2)"/><rect x="20" y="38" width="14" height="14" rx="3.9" fill="#a8559b" fill-opacity="0.85" stroke="#f2c46d" stroke-opacity=".35" stroke-width="1"/><rect x="62" y="38" width="14" height="14" rx="3.9" fill="#8a477f" fill-opacity="0.85" stroke="#f2c46d" stroke-opacity=".35" stroke-width="1"/>
</svg>
